<!DOCTYPE html>
<html lang="ro">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Park Sibiu</title>
  <link rel="icon" href="../graphics/icon.png" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="map-styles.css" />
</head>

<body class="map-page">
  <header class="map-toolbar">
    <a class="brand" href="login.html" aria-label="Park Sibiu map">
      <img src="../graphics/icon.png" alt="">
      <span>Park Sibiu</span>
    </a>

    <nav class="toolbar-actions" aria-label="Map navigation">
      <button class="secondary-button"><a href="profile.html" id="profileBtn" title="Profile">Profile</a></button>
      <button id="openParkingListBtn" class="primary-button" title="Available Parkings">Available Parkings</button>
      <button id="historyBtn" class="secondary-button"><a href="parking-history.html">Parking & Billing History</a></button>
    </nav>
  </header>

  <div id="map"></div>

  <div id="parkingPanel" class="panel-overlay">
    <div class="panel-card parking-card">
      <button id="closeParkingPanelBtn" class="icon-button" title="Close">&#x2715;</button>
      <div id="parkingListView">
        <div id="search-container" class="search-panel">
          <label class="sr-only" for="searchInput">Search by parking name</label>
          <input type="text" id="searchInput" placeholder="Search by parking name...">

          <div class="filter-row">
            <label class="filter-option" for="availableOnlyFilter">
              <input type="checkbox" id="availableOnlyFilter">
              <span>Available Only</span>
            </label>

            <label class="filter-option" for="nonStopFilter">
              <input type="checkbox" id="nonStopFilter">
              <span>Open 24/7</span>
            </label>

            <label class="sr-only" for="sortSelect">Sort parkings</label>
            <select id="sortSelect">
              <option value="default">Sort by Default</option>
              <option value="price-asc">Price (Low to High)</option>
              <option value="price-desc">Price (High to Low)</option>
            </select>
          </div>

          <ul id="parkingList" class="parking-list">
            <li>Loading parkings...</li>
          </ul>
        </div>
      </div>

      <div id="parkingDetailsView" class="parking-details-view">
        <button id="backToParkingListBtn" class="secondary-button">Back to list</button>
        <div id="selectedParkingDetails"></div>
      </div>
    </div>
  </div>

  <div id="reservationPanel" class="panel-overlay reservation-overlay">
    <div class="panel-card reservation-card">
      <h3 id="panelTitle">Book a spot</h3>
      <p id="selectedParkingName" class="selected-parking-name"></p>

      <div class="field-group">
        <label for="carSelect">Your Saved Plates</label>
        <select id="carSelect">
          <option value=""> Select a saved plate </option>
        </select>
      </div>

      <div class="field-group">
        <label for="plateNumber">Plate Number</label>
        <input type="text" id="plateNumber" placeholder="Select or type plate...">
      </div>

      <select id="countrySelect">
        <option value="RO" selected>Romania</option>
      </select>

      <div class="time-grid">
        <div class="field-group">
          <label for="startTime">Start Time</label>
          <input type="time" id="startTime">
        </div>
        <div class="field-group">
          <label for="duration">Hours</label>
          <input type="number" id="duration" value="1" min="1">
        </div>
      </div>

      <label class="filter-option all-day-option" for="allDayCheck">
        <input type="checkbox" id="allDayCheck">
        <span>Book until the end of the day</span>
      </label>

      <button id="confirmBooking" class="primary-button">Confirm Booking</button>
      <button id="closePanel" class="danger-button">Cancel</button>
    </div>
  </div>

  <div id="manageReservation" class="manageReservation">
    <h4>My Reservation</h4>
    <p id="resInfo"></p>

    <p id="costText" class="cost-text"></p>
    <button id="payBtn" class="primary-button">Pay Now</button>
    <p id="statusText" class="status-text"></p>

    <hr>

    <button id="editBtn" class="secondary-button">Edit Time</button>
    <button id="cancelBtn" class="danger-button">Cancel Booking</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script type="module" src="../backend/script.js"></script>

  <script type="module" src="../backend/parking.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parking History - Park Sibiu</title>
    <link rel="stylesheet" href="map-styles.css"> 
    <link rel="icon" href="../graphics/park-icon-unsigned.png" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        .history-container { padding: 20px; max-width: 800px; margin: auto; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .billing-card { background: #fdf2e9; border-left: 5px solid #e67e22; padding: 20px; border-radius: 8px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; }
        .session-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .session-table th, .session-table td { text-align: left; padding: 12px; border-bottom: 1px solid #eee; }
        .session-table th { background-color: #f8f9fa; color: #333; }
        .status-paid { color: #27ae60; font-weight: bold; }
        .status-pending { color: #e67e22; font-weight: bold; }
        .btn-invoice { background: #e67e22; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-invoice:hover { background: #d35400; }
        .back-link { display: inline-block; margin-bottom: 20px; text-decoration: none; color: #3498db; font-weight: bold; }
    </style>
</head>
<body>
    <div class="history-container">
        <a href="index.html" class="back-link" id="lnkBack">← Back to Map</a>
        
        <h1 id="lblTitle">Parking & Billing History</h1>

        <div class="billing-card">
            <div>
                <h3 id="lblBillingSummary" style="margin:0;">Monthly Billing Summary</h3>
                
                <p id="lblBillingDesc" style="margin: 5px 0 0; color: #666; font-size: 14px;">
                    All parking sessions are accumulated and billed at the end of the month.
                </p>
                <h2 id="totalToPay" style="margin: 10px 0 0; color: #2c3e50;">0.00 RON</h2>
            </div>
            <button id="generateInvoiceBtn" class="btn-invoice">Generate Monthly Invoice (PDF)</button>
        </div>

        <h3 id="lblDetailedSessions">Detailed Sessions</h3>
        <table class="session-table">
            <thead>
                <tr>
                    <th id="thDate">Date</th>
                    <th id="thLocation">Location</th>
                    <th id="thDuration">Duration</th>
                    <th id="thPlate">Plate</th>
                    <th id="thCost">Cost</th>
                    <th id="thStatus">Status</th>
                </tr>
            </thead>
            <tbody id="historyTableBody">
                <tr>
                    <td colspan="6" style="text-align:center;" id="lblLoading">Loading your history...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script type="module">
        import { i18n } from '../backend/translations.js';
        import { getHistory, generatePDF } from '../backend/parking-history.js';
        const currentLang = localStorage.getItem('preferredLang') || (navigator.language.startsWith('ro') ? 'ro' : 'en');

        if (i18n && i18n[currentLang]) {
            const t = i18n[currentLang];
            
            if(t.history_back) document.getElementById("lnkBack").innerText = t.history_back;
            if(t.history_title) document.getElementById("lblTitle").innerText = t.history_title;
            if(t.history_billing_summary) document.getElementById("lblBillingSummary").innerText = t.history_billing_summary;
            if(t.history_billing_desc) document.getElementById("lblBillingDesc").innerText = t.history_billing_desc;
            if(t.history_invoice_btn) document.getElementById("generateInvoiceBtn").innerText = t.history_invoice_btn;
            if(t.history_detailed_sessions) document.getElementById("lblDetailedSessions").innerText = t.history_detailed_sessions;
            
            if(t.history_th_date) document.getElementById("thDate").innerText = t.history_th_date;
            if(t.history_th_location) document.getElementById("thLocation").innerText = t.history_th_location;
            if(t.history_th_duration) document.getElementById("thDuration").innerText = t.history_th_duration;
            if(t.history_th_plate) document.getElementById("thPlate").innerText = t.history_th_plate;
            if(t.history_th_cost) document.getElementById("thCost").innerText = t.history_th_cost;
            if(t.history_th_status) document.getElementById("thStatus").innerText = t.history_th_status;
            
            if(t.history_loading) document.getElementById("lblLoading").innerText = t.history_loading;
        }
    </script>
</body>
</html>

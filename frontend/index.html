<!DOCTYPE html>
<html lang="ro">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Park Sibiu</title>
  <link rel="icon" href="../graphics/icon.png" />
  <script src="theme.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="map-styles.css" />
</head>

<body class="map-page">
  <header class="map-toolbar">
    <a class="brand" href="login.html" aria-label="Park Sibiu map">
      <img src="../graphics/icon.png" alt="">
      <span>Park Sibiu</span>
    </a>

    <nav class="toolbar-actions" aria-label="Map navigation">
      <button class="secondary-button"><a href="profile.html" id="profileBtn" title="Profile">Profile</a></button>
      <button id="openParkingListBtn" class="primary-button" title="Available Parkings">
        <span id="nav_available_parkings">Parkings</span>
      </button>
      <button id="historyBtn" class="secondary-button">
        <a href="parking-history.html" id="nav_history">History</a>
      </button>
    </nav>
  </header>

  <div id="map"></div>

  <div id="parkingPanel" class="panel-overlay">
    <div class="panel-card parking-card">
      <button id="closeParkingPanelBtn" class="icon-button" title="Close">&#x2715;</button>
      <div id="parkingListView">
        <div id="search-container" class="search-panel">
          <label class="sr-only" for="searchInput">Search by parking name</label>
          <input type="text" id="searchInput" placeholder="Search by parking name...">

          <div class="filter-row">
            <label class="filter-option" for="availableOnlyFilter">
              <input type="checkbox" id="availableOnlyFilter">
              <span id="lblAvailableOnly">Available Only</span>
            </label>

            <label class="filter-option" for="nonStopFilter">
              <input type="checkbox" id="nonStopFilter">
              <span id="lblNonStop">Open 24/7</span>
            </label>

            <label class="sr-only" for="sortSelect">Sort parkings</label>
            <select id="sortSelect">
              <option id="optSortDefault" value="default">Sort by Default</option>
              <option id="optSortAsc" value="price-asc">Price (Low to High)</option>
              <option id="optSortDesc" value="price-desc">Price (High to Low)</option>
            </select>
          </div>

          <ul id="parkingList" class="parking-list">
            <li id="lblLoadingParkings">Loading parkings...</li>
          </ul>
        </div>
      </div>

      <div id="parkingDetailsView" class="parking-details-view">
        <button id="backToParkingListBtn" class="secondary-button">
          <span id="backToParkingListBtnText">Back to list</span>
        </button>
        <div id="selectedParkingDetails"></div>
      </div>
    </div>
  </div>

  <div id="reservationPanel" class="panel-overlay reservation-overlay">
    <div class="panel-card reservation-card">
      <h3 id="panelTitle">Book a spot</h3>
      <p id="selectedParkingName" class="selected-parking-name"></p>

      <div class="field-group">
        <label id="lblSavedPlates" for="carSelect">Your Saved Plates:</label>
        <select id="carSelect">
          <option id="optSelectPlate" value=""> Select a saved plate </option>
        </select>
      </div>

      <div class="field-group">
        <label id="lblPlateNumber" for="plateNumber">Plate Number:</label>
        <input type="text" id="plateNumber" placeholder="Select or type plate...">
      </div>

      <select id="countrySelect">
        <option value="RO" selected>Romania</option>
      </select>

      <div class="time-grid">
        <div class="field-group">
          <label id="lblStartTime" for="startTime">Start Time:</label>
          <input type="time" id="startTime">
        </div>
        <div class="field-group">
          <label id="lblDurationHours" for="duration">Hours:</label>
          <input type="number" id="duration" value="1" min="1">
        </div>
      </div>

      <label class="filter-option all-day-option" for="allDayCheck">
        <input type="checkbox" id="allDayCheck">
        <span id="lblAllDayCheck">Book until the end of the day</span>
      </label>

      <p id="costPreview" class="cost-text"></p>
      <button id="confirmBooking" class="primary-button">Confirm Booking</button>
      <button id="closePanel" class="danger-button">Cancel</button>
    </div>
  </div>

  <div id="manageReservation" class="manageReservation">
    <h4 id="lblMyReservation">My Reservation</h4>
    <p id="resInfo"></p>

    <p id="costText" class="cost-text"></p>
    <button id="payBtn" class="primary-button">Pay Now</button>
    <p id="statusText" class="status-text"></p>

    <hr>

    <button id="editBtn" class="secondary-button">Edit Time</button>
    <button id="cancelBtn" class="danger-button">Cancel Booking</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script type="module" src="../backend/script.js"></script>
  <script type="module" src="../backend/parking.js"></script>

  <script type="module">
  const localTranslations = {
    ro: {
      nav_available_parkings: "Parcari",
      nav_history: "Istoric",
      lbl_available_only: "Doar Disponibile",
      lbl_non_stop: "Deschis 24/7",
      opt_sort_default: "Sortare Implicita",
      opt_sort_asc: "Pret (Mic la Mare)",
      opt_sort_desc: "Pret (Mare la Mic)",
      lbl_loading_parkings: "Se incarca parcarile...",
      back_to_list: "Inapoi la lista",
      panel_book_title: "Rezerva un loc",
      lbl_saved_plates: "Placute Salvate:",
      opt_select_plate: " Selecteaza o placuta salvata ",
      lbl_plate_number: "Numar Inmatriculare:",
      placeholder_plate: "Selecteaza sau scrie numarul...",
      lbl_start_time: "Ora de inceput:",
      lbl_duration_hours: "Ore:",
      lbl_all_day_check: "Rezerva pana la sfarsitul zilei",
      btn_confirm_booking: "Confirma Rezervarea",
      btn_cancel_panel: "Anuleaza",
      lbl_my_reservation: "Rezervarea Mea",
      btn_pay_now: "Plateste Acum",
      btn_edit_time: "Modifica Ora",
      btn_cancel_booking: "Anuleaza Rezervarea",
      search_placeholder: "Cauta dupa numele parcarii..."
    },
    en: {
      nav_available_parkings: "Parkings",
      nav_history: "History",
      lbl_available_only: "Available Only",
      lbl_non_stop: "Open 24/7",
      opt_sort_default: "Sort by Default",
      opt_sort_asc: "Price (Low to High)",
      opt_sort_desc: "Price (High to Low)",
      lbl_loading_parkings: "Loading parkings...",
      back_to_list: "Back to list",
      panel_book_title: "Book a spot",
      lbl_saved_plates: "Your Saved Plates:",
      opt_select_plate: " Select a saved plate ",
      lbl_plate_number: "Plate Number:",
      placeholder_plate: "Select or type plate...",
      lbl_start_time: "Start Time:",
      lbl_duration_hours: "Hours:",
      lbl_all_day_check: "Book until the end of the day",
      btn_confirm_booking: "Confirm Booking",
      btn_cancel_panel: "Cancel",
      lbl_my_reservation: "My Reservation",
      btn_pay_now: "Pay Now",
      btn_edit_time: "Edit Time",
      btn_cancel_booking: "Cancel Booking",
      search_placeholder: "Search by parking name..."
    }
  };

  const currentLang = localStorage.getItem('preferredLang') || (navigator.language.startsWith('ro') ? 'ro' : 'en');

  function applyStaticTranslations() {
    const lang = localTranslations[currentLang];
    if (!lang) return;

    if (document.getElementById('nav_available_parkings')) document.getElementById('nav_available_parkings').innerText = lang.nav_available_parkings;
    if (document.getElementById('nav_history')) document.getElementById('nav_history').innerText = lang.nav_history;
    if (document.getElementById('lblAvailableOnly')) document.getElementById('lblAvailableOnly').innerText = lang.lbl_available_only;
    if (document.getElementById('lblNonStop')) document.getElementById('lblNonStop').innerText = lang.lbl_non_stop;
    if (document.getElementById('searchInput')) document.getElementById('searchInput').placeholder = lang.search_placeholder;
    if (document.getElementById('optSortDefault')) document.getElementById('optSortDefault').innerText = lang.opt_sort_default;
    if (document.getElementById('optSortAsc')) document.getElementById('optSortAsc').innerText = lang.opt_sort_asc;
    if (document.getElementById('optSortDesc')) document.getElementById('optSortDesc').innerText = lang.opt_sort_desc;
    if (document.getElementById('lblLoadingParkings')) document.getElementById('lblLoadingParkings').innerText = lang.lbl_loading_parkings;
    if (document.getElementById('backToParkingListBtnText')) document.getElementById('backToParkingListBtnText').innerText = lang.back_to_list;
    if (document.getElementById('panelTitle')) document.getElementById('panelTitle').innerText = lang.panel_book_title;
    if (document.getElementById('lblSavedPlates')) document.getElementById('lblSavedPlates').innerText = lang.lbl_saved_plates;
    if (document.getElementById('optSelectPlate')) document.getElementById('optSelectPlate').innerText = lang.opt_select_plate;
    if (document.getElementById('lblPlateNumber')) document.getElementById('lblPlateNumber').innerText = lang.lbl_plate_number;
    if (document.getElementById('plateNumber')) document.getElementById('plateNumber').placeholder = lang.placeholder_plate;
    if (document.getElementById('lblStartTime')) document.getElementById('lblStartTime').innerText = lang.lbl_start_time;
    if (document.getElementById('lblDurationHours')) document.getElementById('lblDurationHours').innerText = lang.lbl_duration_hours;
    if (document.getElementById('lblAllDayCheck')) document.getElementById('lblAllDayCheck').innerText = lang.lbl_all_day_check;
    if (document.getElementById('confirmBooking')) document.getElementById('confirmBooking').innerText = lang.btn_confirm_booking;
    if (document.getElementById('closePanel')) document.getElementById('closePanel').innerText = lang.btn_cancel_panel;
    if (document.getElementById('lblMyReservation')) document.getElementById('lblMyReservation').innerText = lang.lbl_my_reservation;
    if (document.getElementById('payBtn')) document.getElementById('payBtn').innerText = lang.btn_pay_now;
    if (document.getElementById('editBtn')) document.getElementById('editBtn').innerText = lang.btn_edit_time;
    if (document.getElementById('cancelBtn')) document.getElementById('cancelBtn').innerText = lang.btn_cancel_booking;
  }

  document.addEventListener('DOMContentLoaded', applyStaticTranslations);
  applyStaticTranslations();
  </script>
</body>

</html>
